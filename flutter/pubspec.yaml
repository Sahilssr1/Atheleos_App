name: atheleos
description: ATHELEOS - A sports-first social platform connecting athletes, coaches, scouts, and brands.
version: 1.0.2+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation & Routing
  go_router: ^14.0.1

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3

  # Firebase Core & Auth
  firebase_core: ^3.15.2
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  firebase_messaging: ^15.0.2
  flutter_local_notifications: ^22.2.0
  image_picker: ^1.1.2
  http: ^1.2.0
  crypto: ^3.0.3

  # Google Sign-In
  google_sign_in: ^6.2.1

  # UI & Design
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  video_player: ^2.9.2
  video_player_android: ^2.12.2
  visibility_detector: ^0.4.0+2
  # Local Persistence
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  connectivity_plus: ^7.2.0
  package_info_plus: ^10.2.1
  share_plus: ^13.2.1
  device_info_plus: ^13.2.0
  timezone: ^0.11.1
  file_picker: ^12.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation for Riverpod
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
  fonts:
    - family: AthIcons
      fonts:
        - asset: assets/fonts/AthIcons.ttf
